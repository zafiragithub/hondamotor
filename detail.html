<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Motor Honda | PT Astra Honda Motor</title>
    <meta name="theme-color" content="#cc0000"/>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                    colors: { honda: { red: '#cc0000', dark: '#1f1f1f' } }
                }
            }
        }
    </script>
    <style>
        .loader { border-top-color: #cc0000; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .thumb-scroll::-webkit-scrollbar { height: 6px; }
        .thumb-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        /* Efek gradient ala AHM */
        .hero-gradient { background: linear-gradient(180deg, #f8f8f8 0%, #e5e5e5 100%); }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans flex flex-col min-h-screen">

    <nav class="bg-white p-4 shadow-sm fixed w-full top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto max-w-6xl flex justify-between items-center">
            <a href="index.html">
                <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/assets/images/logo/honda.svg" alt="Logo Astra Honda" class="h-8 md:h-10">
            </a>
            <a href="index.html" class="flex items-center text-sm font-bold text-gray-500 hover:text-honda-red transition">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                KEMBALI
            </a>
        </div>
    </nav>

    <div id="loading" class="flex flex-col justify-center items-center py-40 min-h-screen">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-16 w-16 mb-4"></div>
        <p class="text-gray-500 font-semibold animate-pulse">Memuat data motor...</p>
    </div>

    <main id="product-detail" class="hidden flex-grow pt-16 pb-24">
        </main>

    <div id="error-message" class="hidden text-center py-40 min-h-screen flex-grow">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-4">Motor Tidak Ditemukan</h2>
        <p class="text-gray-500 mb-6">Maaf, data motor yang Anda cari tidak tersedia di katalog kami.</p>
        <a href="index.html" class="inline-block bg-honda-red text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-red-700 transition">Lihat Katalog Lain</a>
    </div>

    <footer class="bg-honda-dark text-white text-center py-8 mt-auto">
        <p class="text-sm text-gray-400">&copy; 2026 Sales Motor Honda. Hak cipta dilindungi.</p>
    </footer>

    <script>
        // ==========================================
        // PENGATURAN DATABASE & KONTAK
        // ==========================================
        const SHEET_ID = '1T7cKvl4pwVO5hZWxq0JRm7JI5KeVKl-7Lf6waipXkq8'; // GANTI DENGAN ID SHEET BOS
        const SHEET_NAME = 'DataMotor'; 
        const NOMOR_WA = '6281234567890'; // GANTI NOMOR WA

        const gvizURL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
        const urlParams = new URLSearchParams(window.location.search);
        const motorId = urlParams.get('id');

        const detailContainer = document.getElementById('product-detail');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');

        async function fetchDetail() {
            if (!motorId) { showError(); return; }
            try {
                const response = await fetch(gvizURL);
                const text = await response.text();
                const startIndex = text.indexOf('{');
                const endIndex = text.lastIndexOf('}') + 1;
                const jsonString = text.substring(startIndex, endIndex);
                const data = JSON.parse(jsonString);
                
                const rows = data.table.rows;
                const motor = rows.find(row => row.c[0] && row.c[0].v === motorId);

                if (motor) { renderDetail(motor); } 
                else { showError(); }
            } catch (error) {
                console.error('Error fetching:', error);
                showError();
            }
        }

        function renderDetail(motor) {
            const namaMotor = motor.c[0] ? motor.c[0].v : 'Tanpa Nama';
            const tipeMotor = motor.c[1] ? motor.c[1].v : 'HONDA MATIC';
            const hargaMotor = motor.c[2] ? motor.c[2].v : 'Hubungi Kami';
            
            // Logika Pemisah Gambar (menggunakan titik koma sesuai kesepakatan)
            const teksGambar = motor.c[3] ? String(motor.c[3].v) : '';
            const arrayGambar = teksGambar.split(';').map(url => url.trim()).filter(url => url !== '');
            const gambarUtama = arrayGambar.length > 0 ? arrayGambar[0] : 'https://via.placeholder.com/800x600?text=No+Image';
            
            // Thumbnail Slider
            let thumbnailHtml = '';
            if (arrayGambar.length > 1) {
                thumbnailHtml = `<div class="flex gap-4 mt-8 overflow-x-auto pb-4 thumb-scroll justify-center">`;
                arrayGambar.forEach((url, index) => {
                    thumbnailHtml += `
                        <img src="${url}" 
                             onclick="document.getElementById('main-image').src='${url}'" 
                             class="w-24 h-24 object-contain bg-white rounded-lg border-2 border-transparent hover:border-honda-red cursor-pointer shadow-md flex-shrink-0 transition-all transform hover:-translate-y-1" 
                             alt="Variant ${index + 1}">
                    `;
                });
                thumbnailHtml += `</div><p class="text-center text-xs text-gray-400 mt-2">*Klik gambar untuk melihat varian warna</p>`;
            }

            // Deskripsi (tempat bos menaruh kode tabel spesifikasi)
            const deskripsiMotor = motor.c[4] ? motor.c[4].v : '<p class="text-gray-500">Belum ada spesifikasi yang ditambahkan.</p>';

            document.title = `Harga ${namaMotor} Terbaru | PT Astra Honda Motor`;

            const pesanWA = encodeURIComponent(`Halo bos, saya tertarik dengan motor ${namaMotor} dengan harga OTR ${hargaMotor}. Bisa minta info promo bulan ini dan simulasi kreditnya?`);
            const linkWA = `https://wa.me/${NOMOR_WA}?text=${pesanWA}`;

            const html = `
                <div class="container mx-auto max-w-6xl px-4 py-4">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-widest">Beranda / Produk / <span class="text-honda-red">${namaMotor}</span></p>
                </div>

                <div class="hero-gradient w-full py-12 lg:py-20 border-t border-b border-gray-200">
                    <div class="container mx-auto max-w-6xl px-4 flex flex-col lg:flex-row items-center">
                        
                        <div class="lg:w-1/2 text-center lg:text-left mb-10 lg:mb-0 lg:pr-10 z-10">
                            <span class="inline-block bg-gray-800 text-white text-xs font-bold px-3 py-1 rounded-full tracking-widest mb-4">${tipeMotor}</span>
                            <h1 class="text-5xl lg:text-7xl font-extrabold text-honda-dark mb-4 uppercase tracking-tight">${namaMotor}</h1>
                            <p class="text-xl lg:text-2xl text-gray-600 font-medium mb-6">Mulai Dari <span class="text-honda-red font-bold">${hargaMotor}</span></p>
                            <p class="text-sm text-gray-500 mb-8">*Harga OTR dapat berubah sewaktu-waktu</p>
                            
                            <a href="${linkWA}" target="_blank" class="hidden lg:inline-flex items-center justify-center bg-honda-red hover:bg-red-800 text-white font-bold py-4 px-10 rounded-full transition-all shadow-xl hover:shadow-2xl transform hover:-translate-y-1 text-lg">
                                Konsultasi & Simulasi Kredit
                                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </a>
                        </div>

                        <div class="lg:w-1/2 w-full flex flex-col items-center relative">
                            <div class="absolute inset-0 bg-white opacity-40 rounded-full blur-3xl scale-75"></div>
                            
                            <img id="main-image" src="${gambarUtama}" alt="${namaMotor}" class="w-full max-w-2xl h-auto object-contain drop-shadow-2xl z-10 transition-all duration-500">
                            
                            <div class="w-full z-10">
                                ${thumbnailHtml}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="container mx-auto max-w-4xl px-4 py-16">
                    <h2 class="text-3xl font-extrabold text-honda-dark mb-8 text-center uppercase tracking-wider">Spesifikasi & Promo</h2>
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-gray-600 leading-relaxed text-lg">
                        ${deskripsiMotor}
                    </div>
                </div>

                <div class="fixed bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-2xl lg:hidden z-50">
                    <a href="${linkWA}" target="_blank" class="flex items-center justify-center w-full bg-honda-red hover:bg-red-800 text-white font-bold py-3 px-6 rounded-full transition text-lg">
                        Tanya Promo Sekarang
                    </a>
                </div>
            `;

            loading.style.display = 'none';
            detailContainer.innerHTML = html;
            detailContainer.classList.remove('hidden');
            detailContainer.classList.add('flex', 'flex-col');
        }

        function showError() {
            loading.style.display = 'none';
            errorMessage.classList.remove('hidden');
            errorMessage.classList.add('flex', 'flex-col');
        }

        fetchDetail();
    </script>
</body>
</html>
