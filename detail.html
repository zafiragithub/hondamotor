<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Motor Honda | Sales Resmi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #e53e3e;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <nav class="bg-white p-4 shadow-md fixed w-full top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html">
                <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/assets/images/logo/honda.svg" alt="Logo Astra Honda" class="h-8 md:h-10">
            </a>
            <a href="index.html" class="text-gray-600 font-semibold hover:text-red-600 transition">Kembali ke Katalog</a>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-28 pb-12 flex-grow">
        
        <div id="loading" class="flex justify-center items-center py-20">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
        </div>

        <div id="product-detail" class="hidden max-w-5xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden flex-col md:flex-row border border-gray-100">
            </div>

        <div id="error-message" class="hidden text-center py-20">
            <h2 class="text-2xl font-bold text-gray-800">Motor Tidak Ditemukan</h2>
            <a href="index.html" class="inline-block mt-4 text-red-600 font-semibold hover:underline">Kembali ke Halaman Utama</a>
        </div>
    </main>

    <footer class="bg-gray-900 text-white text-center py-6 mt-auto">
        <p>&copy; 2026 Sales Motor Honda. Hak cipta dilindungi.</p>
    </footer>

    <script>
        // ==========================================
        // PENGATURAN DATABASE & KONTAK
        // ==========================================
        const SHEET_ID = '1T7cKvl4pwVO5hZWxq0JRm7JI5KeVKl-7Lf6waipXkq8'; // Ganti dengan ID Google Sheet Anda
        const SHEET_NAME = 'DataMotor'; 
        const NOMOR_WA = '6281234567890'; // Ganti nomor WA

        const gvizURL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        // Ambil ID motor dari URL (misal: detail.html?id=Honda%20Genio)
        const urlParams = new URLSearchParams(window.location.search);
        const motorId = urlParams.get('id');

        const detailContainer = document.getElementById('product-detail');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');

        async function fetchDetail() {
            if (!motorId) {
                showError();
                return;
            }

            try {
                const response = await fetch(gvizURL);
                const text = await response.text();
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\)/)[1];
                const data = JSON.parse(jsonString);
                
                // Cari baris yang nama motornya (kolom 0) sama dengan parameter URL
                const rows = data.table.rows;
                const motor = rows.find(row => row.c[0] && row.c[0].v === motorId);

                if (motor) {
                    renderDetail(motor);
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Error fetching:', error);
                showError();
            }
        }

        function renderDetail(motor) {
            const namaMotor = motor.c[0] ? motor.c[0].v : 'Tanpa Nama';
            const tipeMotor = motor.c[1] ? motor.c[1].v : '-';
            const hargaMotor = motor.c[2] ? motor.c[2].v : 'Hubungi Kami';
            const gambarMotor = motor.c[3] ? motor.c[3].v : 'https://via.placeholder.com/600x400?text=No+Image';
            
            // Opsional: Jika bos menambah Kolom E (kolom ke-4) untuk Deskripsi
            const deskripsiMotor = motor.c[4] ? motor.c[4].v : 'Hubungi kami sekarang juga untuk mendapatkan promo DP rendah, angsuran ringan, dan proses persetujuan yang cepat untuk pembelian motor ' + namaMotor + ' impian Anda!';

            document.title = `Harga ${namaMotor} Terbaru | Sales Honda`;

            const pesanWA = encodeURIComponent(`Halo bos, saya tertarik dengan motor ${namaMotor} (${hargaMotor}). Bisa minta rincian promo, DP, dan cicilannya?`);
            const linkWA = `https://wa.me/${NOMOR_WA}?text=${pesanWA}`;

            const html = `
                <div class="md:w-1/2 bg-gray-100 p-8 flex justify-center items-center">
                    <img src="${gambarMotor}" alt="${namaMotor}" class="max-w-full h-auto object-contain rounded drop-shadow-xl hover:scale-105 transition-transform duration-300">
                </div>
                
                <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                    <div class="inline-block px-3 py-1 bg-red-100 text-red-600 font-bold text-xs rounded-full uppercase tracking-wider mb-4 w-max">
                        ${tipeMotor}
                    </div>
                    <h1 class="text-3xl md:text-5xl font-extrabold text-gray-900 mb-2">${namaMotor}</h1>
                    <p class="text-2xl font-bold text-gray-600 mb-6 border-b border-gray-200 pb-6">Harga OTR: <span class="text-red-600">${hargaMotor}</span></p>
                    
                    <h3 class="font-bold text-gray-800 mb-2">Deskripsi & Promo</h3>
                    <p class="text-gray-600 leading-relaxed mb-8">
                        ${deskripsiMotor}
                    </p>

                    <div class="mt-auto">
                        <a href="${linkWA}" target="_blank" class="flex items-center justify-center w-full sm:w-auto bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-lg transition shadow-lg text-lg">
                            <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                            Konsultasi Pembelian di Sini
                        </a>
                        <p class="text-center text-sm text-gray-500 mt-3">Proses cepat, syarat mudah & aman.</p>
                    </div>
                </div>
            `;

            loading.style.display = 'none';
            detailContainer.innerHTML = html;
            detailContainer.classList.remove('hidden');
            detailContainer.classList.add('flex');
        }

        function showError() {
            loading.style.display = 'none';
            errorMessage.classList.remove('hidden');
        }

        fetchDetail();
    </script>
</body>
</html>
