<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Motor Honda | Sales Resmi</title>
    <meta name="description" content="Katalog harga dan spesifikasi motor Honda terbaru. Hubungi kami untuk promo menarik!">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #e53e3e;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-white p-4 shadow-md fixed w-full top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#">
                <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/assets/images/logo/honda.svg" alt="Logo Astra Honda" class="h-8 md:h-10">
            </a>
            <a href="#katalog" class="bg-red-600 text-white px-5 py-2 rounded-full font-semibold text-sm hover:bg-red-700 transition shadow-sm">Lihat Promo</a>
        </div>
    </nav>

    <header class="pt-16 md:pt-20">
        <div class="relative w-full h-48 md:h-96 overflow-hidden group">
            
            <div id="slide-container" class="flex transition-transform duration-500 ease-out h-full w-full">
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573ai-11022026-070311.jpg" alt="Promo 1" class="w-full h-full object-cover">
                </div>
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573-copy-1-01122025-062202.jpg" alt="Promo 2" class="w-full h-full object-cover">
                </div>
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573-copy-13112025-090329.jpg" alt="Promo 3" class="w-full h-full object-cover">
                </div>
            </div>

            <button id="prevSlide" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white text-red-600 p-2 md:p-3 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition focus:outline-none hover:bg-gray-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button id="nextSlide" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white text-red-600 p-2 md:p-3 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition focus:outline-none hover:bg-gray-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
            
            <div id="slider-dots" class="absolute bottom-4 left-0 right-0 flex justify-center space-x-2">
                </div>
        </div>
    </header>

    <main id="katalog" class="container mx-auto px-4 py-8 min-h-screen">
        <div class="flex justify-between items-center mb-6 mt-4">
            <h3 class="text-2xl font-bold border-l-4 border-red-600 pl-3">Katalog Terbaru</h3>
        </div>

        <div id="loading" class="flex justify-center items-center py-20">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            </div>
    </main>

    <footer class="bg-gray-900 text-white text-center py-6 mt-12">
        <p>&copy; 2026 Sales Motor Honda. Hak cipta dilindungi.</p>
    </footer>

    <script>
        // ==========================================
        // 1. LOGIKA SLIDER (CAROUSEL)
        // ==========================================
        const slideContainer = document.getElementById('slide-container');
        const slides = slideContainer.children;
        const totalSlides = slides.length;
        const dotsContainer = document.getElementById('slider-dots');
        let currentIndex = 0;
        let slideInterval;

        // Buat indikator dots
        for(let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('button');
            dot.className = `w-3 h-3 rounded-full ${i === 0 ? 'bg-red-600' : 'bg-gray-300'} focus:outline-none transition`;
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }
        const dots = dotsContainer.children;

        function updateSlider() {
            slideContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
            // Update dots
            Array.from(dots).forEach((dot, index) => {
                dot.classList.remove('bg-red-600');
                dot.classList.add('bg-gray-300');
                if(index === currentIndex) {
                    dot.classList.add('bg-red-600');
                    dot.classList.remove('bg-gray-300');
                }
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % totalSlides;
            updateSlider();
            resetInterval();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            updateSlider();
            resetInterval();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateSlider();
            resetInterval();
        }

        function resetInterval() {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 5000); // Slide otomatis tiap 5 detik
        }

        // Event Listener Tombol Slider
        document.getElementById('nextSlide').addEventListener('click', nextSlide);
        document.getElementById('prevSlide').addEventListener('click', prevSlide);
        
        // Mulai autoplay slider
        resetInterval();


        // ==========================================
        // 2. PENGATURAN DATABASE GOOGLE SHEET & KONTAK
        // ==========================================
        const SHEET_ID = '1T7cKvl4pwVO5hZWxq0JRm7JI5KeVKl-7Lf6waipXkq8'; // Ganti dengan ID Google Sheet Anda
        const SHEET_NAME = 'DataMotor'; // Nama tab di Google Sheet
        const NOMOR_WA = '6281234567890'; // Ganti dengan nomor WhatsApp Anda (Gunakan 62 di depan)

        // URL Endpoint Google Visualization API
        const gvizURL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        // Elemen DOM untuk produk
        const productGrid = document.getElementById('product-grid');
        const loading = document.getElementById('loading');

        // Fungsi Mengambil Data
        async function fetchMotorData() {
            try {
                const response = await fetch(gvizURL);
                const text = await response.text();
                
                // Gviz mengembalikan data yang dibungkus function, kita harus memotongnya
                const jsonString = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\)/)[1];
                const data = JSON.parse(jsonString);
                
                // Melewati baris pertama (Header) dan memproses baris data
                const rows = data.table.rows;
                renderProducts(rows);
            } catch (error) {
                console.error('Gagal mengambil data:', error);
                loading.innerHTML = '<p class="text-red-500">Gagal memuat data. Pastikan ID Sheet benar dan akses diset ke Public.</p>';
            }
        }

        // Fungsi Menampilkan Data ke HTML
        function renderProducts(rows) {
            let html = '';

            rows.forEach(row => {
                const namaMotor = row.c[0] ? row.c[0].v : 'Tanpa Nama';
                const tipeMotor = row.c[1] ? row.c[1].v : '-';
                const hargaMotor = row.c[2] ? row.c[2].v : 'Hubungi Kami';
                const gambarMotor = row.c[3] ? row.c[3].v : 'https://via.placeholder.com/300x200?text=No+Image';

                // Format Pesan WhatsApp
                const pesanWA = encodeURIComponent(`Halo bos, saya tertarik dengan motor ${namaMotor}. Bisa minta info promo terbarunya?`);
                const linkWA = `https://wa.me/${NOMOR_WA}?text=${pesanWA}`;

                html += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 border border-gray-100">
                        <img src="${gambarMotor}" alt="${namaMotor}" class="w-full h-48 object-cover object-center bg-gray-100">
                        <div class="p-5">
                            <span class="text-xs font-semibold text-red-600 uppercase tracking-wide">${tipeMotor}</span>
                            <h4 class="text-lg font-bold text-gray-900 mt-1">${namaMotor}</h4>
                            <p class="text-gray-600 mt-2 font-medium">${hargaMotor}</p>
                            <a href="${linkWA}" target="_blank" class="mt-4 block text-center w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition">
                                Pesan via WhatsApp
                            </a>
                        </div>
                    </div>
                `;
            });

            // Sembunyikan loading, tampilkan grid
            loading.style.display = 'none';
            productGrid.innerHTML = html;
            productGrid.classList.remove('hidden');
        }

        // Jalankan saat halaman dimuat
        fetchMotorData();
    </script>
</body>
</html>
