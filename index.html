<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Motor Honda | PT Astra Honda Motor</title>
    <meta name="description" content="Katalog harga dan spesifikasi motor Honda terbaru. Hubungi kami untuk promo menarik!">
    <meta name="theme-color" content="#cc0000"/>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                    colors: { honda: { red: '#cc0000', dark: '#1f1f1f' } }
                }
            }
        }
    </script>
    <style>
        .loader { border-top-color: #cc0000; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Transisi halus untuk gambar di dalam card */
        .card-img-hover { transition: transform 0.5s ease; }
        .group:hover .card-img-hover { transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <nav class="bg-white p-4 shadow-sm fixed w-full top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto max-w-7xl flex justify-between items-center px-2">
            <a href="index.html">
                <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/assets/images/logo/honda.svg" alt="Logo Astra Honda" class="h-8 md:h-10">
            </a>
            <a href="#katalog" class="bg-honda-red text-white px-6 py-2.5 rounded-full font-bold text-sm hover:bg-red-800 transition-colors shadow-md hover:shadow-lg">
                Lihat Produk
            </a>
        </div>
    </nav>

    <header class="pt-16 md:pt-20">
        <div class="relative w-full h-[250px] sm:h-[350px] md:h-[450px] lg:h-[600px] overflow-hidden group bg-white border-b border-gray-200">
            <div id="slide-container" class="flex transition-transform duration-700 ease-out h-full w-full">
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573ai-11022026-070311.jpg" alt="Promo 1" class="w-full h-full object-cover">
                </div>
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573-copy-1-01122025-062202.jpg" alt="Promo 2" class="w-full h-full object-cover">
                </div>
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573-copy-13112025-090329.jpg" alt="Promo 3" class="w-full h-full object-cover">
                </div>
            </div>

            <button id="prevSlide" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-white/80 backdrop-blur-sm text-honda-red p-3 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-all duration-300 focus:outline-none hover:bg-white hover:scale-110">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button id="nextSlide" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-white/80 backdrop-blur-sm text-honda-red p-3 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-all duration-300 focus:outline-none hover:bg-white hover:scale-110">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
            </button>
            
            <div id="slider-dots" class="absolute bottom-6 left-0 right-0 flex justify-center space-x-3"></div>
        </div>
    </header>

    <main id="katalog" class="container mx-auto px-4 py-12 lg:py-20 flex-grow max-w-7xl">
        <div class="text-center mb-12">
            <h3 class="text-3xl md:text-4xl font-extrabold text-honda-dark uppercase tracking-tight">Katalog Produk</h3>
            <div class="w-24 h-1 bg-honda-red mx-auto mt-4 rounded-full"></div>
        </div>

        <div id="loading" class="flex flex-col justify-center items-center py-20">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-16 w-16 mb-4"></div>
            <p class="text-gray-500 font-semibold animate-pulse">Memuat katalog...</p>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 lg:gap-8 hidden">
            </div>
    </main>

    <footer class="bg-honda-dark text-white text-center py-8 mt-auto">
        <p class="text-sm text-gray-400">&copy; 2026 Sales Motor Honda. Hak cipta dilindungi.</p>
    </footer>

    <script>
        // --- LOGIKA SLIDER ---
        const slideContainer = document.getElementById('slide-container');
        const slides = slideContainer.children;
        const totalSlides = slides.length;
        const dotsContainer = document.getElementById('slider-dots');
        let currentIndex = 0; let slideInterval;

        for(let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('button');
            dot.className = `w-3 h-3 rounded-full ${i === 0 ? 'bg-honda-red w-8' : 'bg-white/70'} focus:outline-none transition-all duration-300 shadow-md`;
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }
        const dots = dotsContainer.children;

        function updateSlider() {
            slideContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
            Array.from(dots).forEach((dot, index) => {
                dot.className = `h-3 rounded-full ${index === currentIndex ? 'bg-honda-red w-8' : 'bg-white/70 w-3'} focus:outline-none transition-all duration-300 shadow-md`;
            });
        }
        function nextSlide() { currentIndex = (currentIndex + 1) % totalSlides; updateSlider(); resetInterval(); }
        function prevSlide() { currentIndex = (currentIndex - 1 + totalSlides) % totalSlides; updateSlider(); resetInterval(); }
        function goToSlide(index) { currentIndex = index; updateSlider(); resetInterval(); }
        function resetInterval() { clearInterval(slideInterval); slideInterval = setInterval(nextSlide, 5000); }

        document.getElementById('nextSlide').addEventListener('click', nextSlide);
        document.getElementById('prevSlide').addEventListener('click', prevSlide);
        resetInterval();

        // --- GOOGLE SHEET & GVIZ ---
        // ID Sheet bos sudah terpasang aman di bawah ini
        const SHEET_ID = '1T7cKvl4pwVO5hZWxq0JRm7JI5KeVKl-7Lf6waipXkq8'; 
        const SHEET_NAME = 'DataMotor'; 
        const gvizURL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        const productGrid = document.getElementById('product-grid');
        const loading = document.getElementById('loading');

        async function fetchMotorData() {
            try {
                const response = await fetch(gvizURL);
                if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
                
                const text = await response.text();
                
                if (text.includes('<html')) {
                    throw new Error("Akses ditolak. Pastikan Google Sheet diset ke 'Anyone with the link'.");
                }

                const startIndex = text.indexOf('{');
                const endIndex = text.lastIndexOf('}') + 1;
                
                if (startIndex === -1 || endIndex === 0) {
                    throw new Error("Format respons dari Google Sheet tidak valid.");
                }

                const jsonString = text.substring(startIndex, endIndex);
                const data = JSON.parse(jsonString);

                if (!data.table || !data.table.rows) {
                    throw new Error("Tabel tidak ditemukan. Pastikan nama tab persis 'DataMotor'.");
                }

                renderProducts(data.table.rows);
            } catch (error) {
                console.error("Detail Error:", error);
                loading.innerHTML = `
                    <div class="text-center bg-red-50 p-6 rounded-2xl border border-red-200 mx-4 max-w-lg w-full">
                        <p class="text-honda-red font-extrabold text-xl mb-2">⚠ Gagal Memuat Data</p>
                        <p class="text-red-600 text-sm font-mono bg-white p-3 border border-red-100 rounded-lg shadow-inner">${error.message}</p>
                    </div>
                `;
            }
        }

        function renderProducts(rows) {
            let html = '';
            rows.forEach(row => {
                if (!row || !row.c || !row.c[0]) return;

                const namaMotor = row.c[0] ? row.c[0].v : 'Tanpa Nama';
                const tipeMotor = row.c[1] ? row.c[1].v : 'HONDA';
                const hargaMotor = row.c[2] ? row.c[2].v : 'Hubungi Kami';
                
                // Pemisah Gambar menggunakan titik koma (;)
                const teksGambar = row.c[3] ? String(row.c[3].v) : '';
                const arrayGambar = teksGambar.split(';').map(url => url.trim()).filter(url => url !== '');
                const gambarUtama = arrayGambar.length > 0 ? arrayGambar[0] : 'https://via.placeholder.com/300x200?text=No+Image';

                const linkDetail = `detail.html?id=${encodeURIComponent(namaMotor)}`;

                html += `
                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 group flex flex-col h-full cursor-pointer" onclick="window.location.href='${linkDetail}'">
                        
                        <div class="w-full h-56 bg-gray-50 flex items-center justify-center p-6 relative overflow-hidden">
                            <div class="absolute inset-0 bg-white opacity-40 rounded-full blur-2xl scale-75 group-hover:scale-100 transition-transform duration-500"></div>
                            
                            <img src="${gambarUtama}" alt="${namaMotor}" class="card-img-hover max-w-full max-h-full object-contain drop-shadow-xl relative z-10">
                        </div>
                        
                        <div class="p-6 flex flex-col flex-grow text-center bg-white z-20">
                            <span class="inline-block bg-gray-100 text-gray-500 font-bold text-[10px] uppercase tracking-widest py-1.5 px-3 rounded-full mb-4 mx-auto">${tipeMotor}</span>
                            
                            <h4 class="text-xl font-extrabold text-honda-dark mb-1 tracking-tight">${namaMotor}</h4>
                            
                            <p class="text-honda-red font-bold text-lg mb-6 flex-grow">${hargaMotor}</p>
                            
                            <a href="${linkDetail}" class="mt-auto inline-flex items-center justify-center w-full bg-white border-2 border-honda-red text-honda-red hover:bg-honda-red hover:text-white font-bold py-2.5 px-4 rounded-full transition-colors duration-300 text-sm">
                                Selengkapnya
                                <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                            </a>
                        </div>
                    </div>
                `;
            });
            
            if (html === '') {
                loading.innerHTML = '<p class="text-gray-500 font-semibold">Tabel Google Sheet kosong. Silakan isi datanya terlebih dahulu.</p>';
            } else {
                loading.style.display = 'none';
                productGrid.innerHTML = html;
                productGrid.classList.remove('hidden');
            }
        }
        
        fetchMotorData();
    </script>
</body>
</html>
