<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Motor Honda | Sales Resmi</title>
    <meta name="description" content="Katalog harga dan spesifikasi motor Honda terbaru. Hubungi kami untuk promo menarik!">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #e53e3e;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-white p-4 shadow-md fixed w-full top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html">
                <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/assets/images/logo/honda.svg" alt="Logo Astra Honda" class="h-8 md:h-10">
            </a>
            <a href="#katalog" class="bg-red-600 text-white px-5 py-2 rounded-full font-semibold text-sm hover:bg-red-700 transition shadow-sm">Lihat Promo</a>
        </div>
    </nav>

    <header class="pt-16 md:pt-20">
        <div class="relative w-full h-[250px] sm:h-[350px] md:h-[450px] lg:h-[600px] overflow-hidden group bg-white border-b">
            <div id="slide-container" class="flex transition-transform duration-500 ease-out h-full w-full">
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573ai-11022026-070311.jpg" alt="Promo 1" class="w-full h-full object-cover">
                </div>
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573-copy-1-01122025-062202.jpg" alt="Promo 2" class="w-full h-full object-cover">
                </div>
                <div class="w-full h-full flex-shrink-0 relative">
                    <img src="https://ik.imagekit.io/zlt25mb52fx/ahmcdn/tr:q-70,pr-true,f-auto/uploads/page/banner/homepage-banner-1366x573-copy-13112025-090329.jpg" alt="Promo 3" class="w-full h-full object-cover">
                </div>
            </div>

            <button id="prevSlide" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white text-red-600 p-2 md:p-3 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition focus:outline-none hover:bg-gray-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button id="nextSlide" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white text-red-600 p-2 md:p-3 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition focus:outline-none hover:bg-gray-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
            
            <div id="slider-dots" class="absolute bottom-4 left-0 right-0 flex justify-center space-x-2"></div>
        </div>
    </header>

    <main id="katalog" class="container mx-auto px-4 py-8 min-h-screen">
        <div class="flex justify-between items-center mb-6 mt-4">
            <h3 class="text-2xl font-bold border-l-4 border-red-600 pl-3">Katalog Terbaru</h3>
        </div>

        <div id="loading" class="flex justify-center items-center py-20">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            </div>
    </main>

    <footer class="bg-gray-900 text-white text-center py-6 mt-12">
        <p>&copy; 2026 Sales Motor Honda. Hak cipta dilindungi.</p>
    </footer>

    <script>
        // --- LOGIKA SLIDER ---
        const slideContainer = document.getElementById('slide-container');
        const slides = slideContainer.children;
        const totalSlides = slides.length;
        const dotsContainer = document.getElementById('slider-dots');
        let currentIndex = 0; let slideInterval;

        for(let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('button');
            dot.className = `w-3 h-3 rounded-full ${i === 0 ? 'bg-red-600' : 'bg-gray-300'} focus:outline-none transition shadow-sm`;
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }
        const dots = dotsContainer.children;

        function updateSlider() {
            slideContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
            Array.from(dots).forEach((dot, index) => {
                dot.className = `w-3 h-3 rounded-full ${index === currentIndex ? 'bg-red-600' : 'bg-gray-300'} focus:outline-none transition shadow-sm`;
            });
        }
        function nextSlide() { currentIndex = (currentIndex + 1) % totalSlides; updateSlider(); resetInterval(); }
        function prevSlide() { currentIndex = (currentIndex - 1 + totalSlides) % totalSlides; updateSlider(); resetInterval(); }
        function goToSlide(index) { currentIndex = index; updateSlider(); resetInterval(); }
        function resetInterval() { clearInterval(slideInterval); slideInterval = setInterval(nextSlide, 5000); }

        document.getElementById('nextSlide').addEventListener('click', nextSlide);
        document.getElementById('prevSlide').addEventListener('click', prevSlide);
        resetInterval();

        // --- GOOGLE SHEET & GVIZ ---
        // PENTING: Jangan hapus tanda kutip tunggal (' ') di awal dan akhir ID
        const SHEET_ID = '1T7cKvl4pwVO5hZWxq0JRm7JI5KeVKl-7Lf6waipXkq8'; 
        const SHEET_NAME = 'DataMotor'; 
        const gvizURL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        const productGrid = document.getElementById('product-grid');
        const loading = document.getElementById('loading');

        async function fetchMotorData() {
            try {
                const response = await fetch(gvizURL);
                if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
                
                const text = await response.text();
                
                // Pengecekan jika link sheet dibatasi (bukan public)
                if (text.includes('<html')) {
                    throw new Error("Akses ditolak. Pastikan Google Sheet diset ke 'Anyone with the link'.");
                }

                // Cara ekstraksi JSON yang lebih aman, menghindari error regex
                const startIndex = text.indexOf('{');
                const endIndex = text.lastIndexOf('}') + 1;
                
                if (startIndex === -1 || endIndex === 0) {
                    throw new Error("Format respons dari Google Sheet tidak valid.");
                }

                const jsonString = text.substring(startIndex, endIndex);
                const data = JSON.parse(jsonString);

                if (!data.table || !data.table.rows) {
                    throw new Error("Tabel tidak ditemukan. Pastikan nama tab persis 'DataMotor'.");
                }

                renderProducts(data.table.rows);
            } catch (error) {
                console.error("Detail Error:", error);
                loading.innerHTML = `
                    <div class="text-center bg-red-100 p-6 rounded-lg border border-red-300 mx-4 max-w-lg w-full">
                        <p class="text-red-700 font-bold text-lg mb-2">⚠ Gagal Memuat Data</p>
                        <p class="text-red-600 text-sm font-mono bg-white p-2 border border-red-200 rounded">${error.message}</p>
                    </div>
                `;
            }
        }

        function renderProducts(rows) {
            let html = '';
            rows.forEach(row => {
                if (!row || !row.c || !row.c[0]) return;

                const namaMotor = row.c[0] ? row.c[0].v : 'Tanpa Nama';
                const tipeMotor = row.c[1] ? row.c[1].v : '-';
                const hargaMotor = row.c[2] ? row.c[2].v : 'Hubungi Kami';
                
                // --- LOGIKA PEMISAH GAMBAR ---
                const teksGambar = row.c[3] ? row.c[3].v : '';
                // Pisahkan dengan koma, ambil urutan pertama [0]
                const arrayGambar = teksGambar.split(',').map(url => url.trim());
                const gambarUtama = arrayGambar[0] || 'https://via.placeholder.com/300x200?text=No+Image';

                const linkDetail = `detail.html?id=${encodeURIComponent(namaMotor)}`;

                html += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 border border-gray-100 flex flex-col h-full">
                        <img src="${gambarUtama}" alt="${namaMotor}" class="w-full h-48 object-cover object-center bg-gray-100">
                        <div class="p-5 flex flex-col flex-grow">
                            <span class="text-xs font-semibold text-red-600 uppercase tracking-wide">${tipeMotor}</span>
                            <h4 class="text-lg font-bold text-gray-900 mt-1">${namaMotor}</h4>
                            <p class="text-gray-600 mt-2 font-medium flex-grow">${hargaMotor}</p>
                            
                            <a href="${linkDetail}" class="mt-4 block text-center w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition mt-auto">
                                Selengkapnya
                            </a>
                        </div>
                    </div>
                `;
            });
            
            if (html === '') {
                loading.innerHTML = '<p class="text-gray-500 font-semibold">Tabel Google Sheet kosong. Silakan isi datanya terlebih dahulu.</p>';
            } else {
                loading.style.display = 'none';
                productGrid.innerHTML = html;
                productGrid.classList.remove('hidden');
            }
        }
        fetchMotorData();
    </script>
</body>
</html>
