<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Admin | Honda Sales</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                    colors: { honda: { red: '#cc0000', dark: '#1f1f1f' } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-honda-dark p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto max-w-4xl flex justify-between items-center">
            <div class="text-white font-extrabold text-xl tracking-wider">
                HONDA<span class="text-honda-red">ADMIN</span>
            </div>
            <a href="index.html" target="_blank" class="text-gray-300 hover:text-white text-sm font-semibold transition">
                Lihat Website
            </a>
        </div>
    </nav>

    <main class="container mx-auto max-w-3xl px-4 py-10 flex-grow">
        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
            <div class="mb-8 border-b border-gray-200 pb-4">
                <h1 class="text-2xl font-extrabold text-honda-dark">Tambah Motor Baru</h1>
                <p class="text-gray-500 text-sm mt-1">Data yang dikirim akan otomatis masuk ke baris paling bawah di Google Sheet.</p>
            </div>

            <div id="alert-box" class="hidden mb-6 p-4 rounded-lg font-bold text-sm text-center"></div>

            <form id="form-admin" name="submit-to-google-sheet" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Nama Motor <span class="text-red-500">*</span></label>
                        <input type="text" name="nama" required placeholder="Contoh: Honda Vario 160 ABS" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-honda-red focus:ring-2 focus:ring-red-200 outline-none transition bg-gray-50 focus:bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Kategori / Tipe <span class="text-red-500">*</span></label>
                        <select name="tipe" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-honda-red focus:ring-2 focus:ring-red-200 outline-none transition bg-gray-50 focus:bg-white cursor-pointer">
                            <option value="" disabled selected>Pilih Tipe</option>
                            <option value="MATIC">Matic</option>
                            <option value="SPORT">Sport</option>
                            <option value="CUB">Cub (Bebek)</option>
                            <option value="EV">EV (Listrik)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Harga OTR <span class="text-red-500">*</span></label>
                    <input type="text" name="harga" required placeholder="Contoh: Rp 29.513.000" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-honda-red focus:ring-2 focus:ring-red-200 outline-none transition bg-gray-50 focus:bg-white">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Link Gambar <span class="text-red-500">*</span></label>
                    <input type="text" name="gambar" required placeholder="Contoh: link1.jpg ; link2.jpg" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-honda-red focus:ring-2 focus:ring-red-200 outline-none transition bg-gray-50 focus:bg-white">
                    <p class="text-xs text-gray-400 mt-1">*Jika lebih dari 1 gambar, pisahkan dengan titik koma ( ; )</p>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Deskripsi & Spesifikasi <span class="text-red-500">*</span></label>
                    <textarea name="deskripsi" required rows="6" placeholder="Masukkan teks promo atau tempelkan kode HTML tabel spesifikasi di sini..." class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-honda-red focus:ring-2 focus:ring-red-200 outline-none transition bg-gray-50 focus:bg-white font-mono text-sm"></textarea>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <button type="submit" id="btn-submit" class="w-full bg-honda-red hover:bg-red-800 text-white font-extrabold py-4 px-6 rounded-xl transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-1 flex justify-center items-center">
                        <span id="btn-text">Simpan ke Google Sheet</span>
                        <svg id="btn-spinner" class="hidden animate-spin ml-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // GANTI TULISAN DI BAWAH INI DENGAN LINK DARI GOOGLE APPS SCRIPT BOS
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz6Iw7RxUDumhgVv1FTWo3l2LGRndGDqCBJq_ZB1KqhJO4NCJNrW5VwkZdyWHTt1mJzHA/exec';
        
        const form = document.forms['submit-to-google-sheet'];
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Ubah tombol jadi loading
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');
            btnText.textContent = 'Menyimpan...';
            btnSpinner.classList.remove('hidden');
            alertBox.classList.add('hidden');

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    // Berhasil
                    alertBox.textContent = '✅ Data motor berhasil ditambahkan ke Google Sheet!';
                    alertBox.className = 'mb-6 p-4 rounded-lg font-bold text-sm text-center bg-green-100 text-green-700 border border-green-200 block';
                    form.reset();
                })
                .catch(error => {
                    // Gagal
                    console.error('Error!', error.message);
                    alertBox.textContent = '❌ Gagal menyimpan data. Pastikan link Web App sudah benar.';
                    alertBox.className = 'mb-6 p-4 rounded-lg font-bold text-sm text-center bg-red-100 text-red-700 border border-red-200 block';
                })
                .finally(() => {
                    // Kembalikan tombol ke semula
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
                    btnText.textContent = 'Simpan ke Google Sheet';
                    btnSpinner.classList.add('hidden');
                    
                    // Hilangkan notif setelah 5 detik
                    setTimeout(() => { alertBox.classList.add('hidden'); }, 5000);
                });
        });
    </script>
</body>
</html>
