<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Admin Pro | Honda Sales</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] }, colors: { honda: { red: '#cc0000', dark: '#1f1f1f' } } } } }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-honda-dark p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto max-w-6xl flex justify-between items-center">
            <div class="text-white font-extrabold text-xl tracking-wider">
                HONDA<span class="text-honda-red">ADMIN</span>
            </div>
            <a href="index.html" target="_blank" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Lihat Website</a>
        </div>
    </nav>

    <main class="container mx-auto max-w-6xl px-4 py-10 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 bg-white rounded-2xl shadow-lg border border-gray-100 p-6 h-fit sticky top-24">
            <div class="mb-6 border-b border-gray-200 pb-4 flex justify-between items-center">
                <h2 id="form-title" class="text-xl font-extrabold text-honda-dark">Tambah Motor Baru</h2>
                <button type="button" id="btn-cancel-edit" class="hidden text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300">Batal Edit</button>
            </div>

            <div id="alert-box" class="hidden mb-6 p-3 rounded-lg font-bold text-sm text-center"></div>

            <form id="form-admin" class="space-y-4">
                <input type="hidden" id="input-action" name="action" value="create">
                <input type="hidden" id="input-original-name" name="originalName" value="">

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nama Motor</label>
                    <input type="text" id="input-nama" name="nama" required class="w-full px-3 py-2 text-sm rounded border focus:border-honda-red outline-none bg-gray-50">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Tipe</label>
                        <select id="input-tipe" name="tipe" required class="w-full px-3 py-2 text-sm rounded border focus:border-honda-red outline-none bg-gray-50">
                            <option value="MATIC">Matic</option>
                            <option value="SPORT">Sport</option>
                            <option value="CUB">Cub (Bebek)</option>
                            <option value="EV">EV (Listrik)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Harga OTR</label>
                        <input type="text" id="input-harga" name="harga" required class="w-full px-3 py-2 text-sm rounded border focus:border-honda-red outline-none bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Link Gambar (;)</label>
                    <input type="text" id="input-gambar" name="gambar" required class="w-full px-3 py-2 text-sm rounded border focus:border-honda-red outline-none bg-gray-50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Teks Promo</label>
                    <textarea id="input-promo" rows="3" placeholder="Teks promo biasa..." class="w-full px-3 py-2 text-sm rounded border focus:border-honda-red outline-none bg-gray-50"></textarea>
                </div>

                <div id="spec-container">
                    <label class="block text-xs font-bold text-gray-700 mb-1 flex justify-between">
                        <span>Spesifikasi Otomatis</span>
                        <span class="text-red-500 font-normal">Gunakan tanda ( : )</span>
                    </label>
                    <textarea id="input-spek" rows="4" placeholder="Tipe Mesin : 4 Langkah&#10;Kapasitas : 150cc" class="w-full px-3 py-2 text-sm rounded border focus:border-honda-red outline-none bg-gray-50 font-mono"></textarea>
                </div>
                
                <input type="hidden" id="input-deskripsi" name="deskripsi">

                <button type="submit" id="btn-submit" class="w-full bg-honda-red hover:bg-red-800 text-white font-bold py-3 px-4 rounded-xl transition-all flex justify-center">
                    <span id="btn-text">Simpan Data</span>
                </button>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white rounded-2xl shadow-lg border border-gray-100 p-6">
            <h2 class="text-xl font-extrabold text-honda-dark mb-4 border-b border-gray-200 pb-4">Daftar Motor (Database)</h2>
            <div id="table-loading" class="text-center py-10 text-gray-500">Memuat data dari Google Sheet...</div>
            
            <div class="overflow-x-auto hidden" id="table-container">
                <table class="min-w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-600 uppercase text-xs font-bold">
                        <tr>
                            <th class="px-4 py-3 rounded-tl-lg">Gambar</th>
                            <th class="px-4 py-3">Nama Motor</th>
                            <th class="px-4 py-3">Tipe</th>
                            <th class="px-4 py-3">Harga</th>
                            <th class="px-4 py-3 rounded-tr-lg text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-100">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // 1. PENGATURAN API
        // ==========================================
        // PASTIKAN URL WEB APP INI SUDAH BENAR MILIK BOS
        const SCRIPT_URL = 'MASUKKAN_URL_WEB_APP_GAS_DI_SINI'; 
        const SHEET_ID = '1T7cKvl4pwVO5hZWxq0JRm7JI5KeVKl-7Lf6waipXkq8'; 
        
        // Tambahkan &headers=1 di sini juga
        const gvizURL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=DataMotor`;
        let globalDataMotor = [];

        // DOM Elements
        const form = document.getElementById('form-admin');
        const alertBox = document.getElementById('alert-box');
        const tableBody = document.getElementById('table-body');
        const tableContainer = document.getElementById('table-container');
        const tableLoading = document.getElementById('table-loading');
        const formTitle = document.getElementById('form-title');
        const btnCancelEdit = document.getElementById('btn-cancel-edit');
        const specContainer = document.getElementById('spec-container');

        // ==========================================
        // 2. AMBIL DATA UNTUK TABEL
        // ==========================================
        async function loadTable() {
            tableLoading.style.display = 'block';
            tableContainer.classList.add('hidden');
            tableBody.innerHTML = '';
            globalDataMotor = [];

            try {
                const response = await fetch(gvizURL);
                const text = await response.text();
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                
                let rows = data.table.rows;
                let html = '';

                rows.forEach(row => {
                    if (!row || !row.c || row.c.length === 0) return;
                    
                    let cellNama = row.c[0];
                    if (!cellNama || cellNama.v === null || cellNama.v === undefined) return;
                    
                    const nama = String(cellNama.v).trim();
                    
                    // Blokir judul kolom dan baris kosong
                    if (nama === '' || 
                        nama.toLowerCase() === 'null' || 
                        nama.toLowerCase() === 'nama motor' || 
                        nama.toLowerCase() === 'nama') {
                        return; 
                    }

                    const tipe = row.c[1] && row.c[1].v ? row.c[1].v : '-';
                    const harga = row.c[2] && row.c[2].v ? row.c[2].v : '-';
                    const gambarRaw = row.c[3] && row.c[3].v ? String(row.c[3].v) : '';
                    const deskripsiHtml = row.c[4] && row.c[4].v ? row.c[4].v : '';
                    const gambarUtama = gambarRaw.split(';')[0] || 'https://via.placeholder.com/50';

                    globalDataMotor.push({nama, tipe, harga, gambar: gambarRaw, deskripsi: deskripsiHtml});

                    html += `
                        <tr class="hover:bg-gray-50 transition border-b border-gray-100">
                            <td class="px-4 py-3"><img src="${gambarUtama}" class="w-12 h-12 object-cover rounded bg-white border"></td>
                            <td class="px-4 py-3 font-bold text-honda-dark">${nama}</td>
                            <td class="px-4 py-3"><span class="bg-gray-200 text-xs px-2 py-1 rounded">${tipe}</span></td>
                            <td class="px-4 py-3 text-honda-red font-semibold">${harga}</td>
                            <td class="px-4 py-3 text-center space-x-2">
                                <button onclick="editMotor('${nama}')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded text-xs font-bold transition">Edit</button>
                                <button onclick="deleteMotor('${nama}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded text-xs font-bold transition">Hapus</button>
                            </td>
                        </tr>
                    `;
                });

                if(html === '') {
                     tableLoading.innerHTML = `<span class="text-gray-500">Belum ada data motor.</span>`;
                } else {
                    tableBody.innerHTML = html;
                    tableLoading.style.display = 'none';
                    tableContainer.classList.remove('hidden');
                }
            } catch (error) {
                tableLoading.innerHTML = `<span class="text-red-500 font-bold">Gagal memuat tabel database.</span>`;
            }
        }

        // ==========================================
        // 3. FUNGSI EDIT & HAPUS
        // ==========================================
        function editMotor(namaMotor) {
            const motor = globalDataMotor.find(m => m.nama === namaMotor);
            if(!motor) return;

            document.getElementById('input-action').value = 'update';
            document.getElementById('input-original-name').value = motor.nama;
            document.getElementById('input-nama').value = motor.nama;
            document.getElementById('input-tipe').value = motor.tipe;
            document.getElementById('input-harga').value = motor.harga;
            document.getElementById('input-gambar').value = motor.gambar;
            
            document.getElementById('input-promo').value = motor.deskripsi;
            specContainer.style.display = 'none'; 

            formTitle.textContent = 'Edit Motor';
            formTitle.classList.add('text-blue-600');
            document.getElementById('btn-text').textContent = 'Update Data Motor';
            document.getElementById('btn-submit').classList.replace('bg-honda-red', 'bg-blue-600');
            document.getElementById('btn-submit').classList.replace('hover:bg-red-800', 'hover:bg-blue-800');
            btnCancelEdit.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        btnCancelEdit.addEventListener('click', resetForm);

        function resetForm() {
            form.reset();
            document.getElementById('input-action').value = 'create';
            document.getElementById('input-original-name').value = '';
            specContainer.style.display = 'block';
            
            formTitle.textContent = 'Tambah Motor Baru';
            formTitle.classList.remove('text-blue-600');
            document.getElementById('btn-text').textContent = 'Simpan Data';
            document.getElementById('btn-submit').classList.replace('bg-blue-600', 'bg-honda-red');
            document.getElementById('btn-submit').classList.replace('hover:bg-blue-800', 'hover:bg-red-800');
            btnCancelEdit.classList.add('hidden');
        }

        function deleteMotor(namaMotor) {
            if(confirm(`YAKIN INGIN MENGHAPUS ${namaMotor} DARI KATALOG?`)) {
                let formData = new FormData();
                formData.append('action', 'delete');
                formData.append('nama', namaMotor);

                fetch(SCRIPT_URL, { method: 'POST', body: formData })
                    .then(res => res.text())
                    .then(result => {
                        alert(result);
                        loadTable();
                    });
            }
        }

        // ==========================================
        // 4. GENERATOR HTML & SUBMIT FORM
        // ==========================================
        form.addEventListener('submit', e => {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-50');
            
            let action = document.getElementById('input-action').value;
            let promoText = document.getElementById('input-promo').value;
            let finalHTML = promoText; 

            if (action === 'create') {
                let specText = document.getElementById('input-spek').value;
                if (specText.trim() !== '') {
                    finalHTML += '<br><br><ul class="text-sm space-y-2 w-full mt-4">';
                    let lines = specText.split('\n');
                    lines.forEach(line => {
                        if (line.includes(':')) {
                            let parts = line.split(':');
                            let key = parts[0].trim();
                            let val = parts.slice(1).join(':').trim();
                            finalHTML += `<li class="flex justify-between border-b border-gray-200 pb-1"><span class="font-semibold text-gray-700 pr-4">${key}</span> <span class="text-right text-gray-600">${val}</span></li>`;
                        } else if (line.trim() !== '') {
                            finalHTML += `<li class="border-b border-gray-200 pb-1 text-gray-600">${line.trim()}</li>`;
                        }
                    });
                    finalHTML += '</ul>';
                }
            }

            document.getElementById('input-deskripsi').value = finalHTML;

            fetch(SCRIPT_URL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alertBox.textContent = '✅ Berhasil!';
                    alertBox.className = 'mb-6 p-3 rounded font-bold text-sm text-center bg-green-100 text-green-700 block';
                    resetForm();
                    loadTable(); 
                })
                .catch(error => {
                    alertBox.textContent = '❌ Gagal menyimpan. Cek URL Web App.';
                    alertBox.className = 'mb-6 p-3 rounded font-bold text-sm text-center bg-red-100 text-red-700 block';
                })
                .finally(() => {
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove('opacity-50');
                    setTimeout(() => { alertBox.classList.add('hidden'); }, 4000);
                });
        });

        loadTable();
    </script>
</body>
</html>
